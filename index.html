<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tobi Panel key</title>
<!--
  Static page for GitHub Pages (or any web host): no server, no cookies.
  After a short countdown it shows a key for Tobi Panel. The key says when it stops working and carries a signature that
  the app (Emulator/KeyGate.h) checks without a server.
  SECRET must be the same text as kSecret in KeyGate.h.
  The script is public, so anyone can read it and make keys: this is a speed bump, not protection.
-->
<style>
  :root { color-scheme: dark; --bg:#17171c; --card:#222229; --line:#34343e; --text:#f2f2f5; --dim:#9a9aa6; --accent:#0a84ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(1200px 600px at 20% 0%, #2a2140 0%, var(--bg) 55%); color:var(--text);
         font:16px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; padding:24px; }
  .card { width:min(480px,100%); background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  h1 { font-size:22px; margin:0 0 6px; }
  p { margin:0 0 18px; color:var(--dim); }
  .bar { height:8px; background:#2c2c35; border-radius:99px; overflow:hidden; margin:6px 0 10px; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .25s linear; }
  .key { font:600 20px/1.3 ui-monospace, Consolas, monospace; letter-spacing:.04em; text-align:center; background:#15151a; border:1px solid var(--line);
         border-radius:12px; padding:16px 10px; user-select:all; word-break:break-all; }
  button { width:100%; margin-top:14px; padding:12px; border:0; border-radius:12px; font:600 16px system-ui,sans-serif; background:var(--accent); color:#fff; cursor:pointer; }
  button:active { filter:brightness(.9); }
  .small { font-size:13px; color:var(--dim); margin-top:14px; text-align:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>Tobi Panel key</h1>
  <p id="intro">Your key is being made. Please wait a moment.</p>

  <section id="wait">
    <div class="bar"><i id="fill"></i></div>
    <div class="small" id="count">8</div>
  </section>

  <section id="done" hidden>
    <div class="key" id="key"></div>
    <button id="copy" type="button">Copy key</button>
    <div class="small" id="until"></div>
    <div class="small">Paste it into Tobi Panel when it asks for a key.</div>
  </section>
</main>

<script>
"use strict";
const SECRET = "7aaf4fc789a9dbf64d6b89655b4f30e8";   // same as kSecret in Emulator/KeyGate.h
const WAIT_SECONDS = 8;                              // the countdown
const KEY_HOURS = 24;                                // how long a key works
const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const EPOCH = 1735689600;                            // 2025-01-01 00:00:00 UTC

// ---- SHA-256 and HMAC (small, no libraries) ----
const K = new Uint32Array([
 0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
 0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
 0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
 0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(msg) {
  const h = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const len = msg.length, total = ((len + 9 + 63) >> 6) << 6;
  const p = new Uint8Array(total);
  p.set(msg); p[len] = 0x80;
  const dv = new DataView(p.buffer);
  dv.setUint32(total - 8, Math.floor(len / 0x20000000), false);
  dv.setUint32(total - 4, (len << 3) >>> 0, false);
  const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,hh] = h;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25), ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h[0]=(h[0]+a)>>>0; h[1]=(h[1]+b)>>>0; h[2]=(h[2]+c)>>>0; h[3]=(h[3]+d)>>>0;
    h[4]=(h[4]+e)>>>0; h[5]=(h[5]+f)>>>0; h[6]=(h[6]+g)>>>0; h[7]=(h[7]+hh)>>>0;
  }
  const out = new Uint8Array(32), od = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) od.setUint32(i * 4, h[i], false);
  return out;
}
function hmac(key, msg) {
  if (key.length > 64) key = sha256(key);
  const ipad = new Uint8Array(64 + msg.length), opad = new Uint8Array(96);
  for (let i = 0; i < 64; i++) { const k = i < key.length ? key[i] : 0; ipad[i] = k ^ 0x36; opad[i] = k ^ 0x5c; }
  ipad.set(msg, 64);
  opad.set(sha256(ipad), 64);
  return sha256(opad);
}
const utf8 = s => new TextEncoder().encode(s);

// ---- the key ----
function enc(n, len) { let s = ""; for (let i = len - 1; i >= 0; i--) s += ALPHA[(n >> (5 * i)) & 31]; return s; }
function macChars(body) {
  const m = hmac(utf8(SECRET), utf8(body));
  let s = "";
  for (let i = 0; i < 10; i++) {
    const bit = i * 5, byte = bit >> 3, off = bit & 7;
    const v = (m[byte] << 8) | (m[byte + 1] || 0);
    s += ALPHA[(v >> (11 - off)) & 31];
  }
  return s;
}
function makeKey(nowSeconds) {
  const hours = Math.floor((nowSeconds - EPOCH) / 3600) + KEY_HOURS;      // the hour it stops working
  const r = new Uint32Array(1); crypto.getRandomValues(r);
  const body = enc(hours, 5) + enc(r[0] & 0x1ffffff, 5);
  const mac = macChars(body);
  return { key: "TOBI-" + body.slice(0,5) + "-" + body.slice(5,10) + "-" + mac.slice(0,5) + "-" + mac.slice(5,10),
           until: new Date((EPOCH + hours * 3600) * 1000) };
}

// ---- the page ----
const $ = id => document.getElementById(id);
let left = WAIT_SECONDS;
$("count").textContent = left + " s";
const timer = setInterval(() => {
  left--;
  $("fill").style.width = ((WAIT_SECONDS - left) / WAIT_SECONDS * 100) + "%";
  $("count").textContent = Math.max(left, 0) + " s";
  if (left <= 0) {
    clearInterval(timer);
    const made = makeKey(Math.floor(Date.now() / 1000));
    $("key").textContent = made.key;
    $("until").textContent = "Works until " + made.until.toLocaleString();
    $("wait").hidden = true; $("done").hidden = false;
    $("intro").textContent = "Here is your key.";
  }
}, 1000);
setTimeout(() => { $("fill").style.width = (1 / WAIT_SECONDS * 100) + "%"; }, 50);
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("key").textContent); $("copy").textContent = "Copied"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("key")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("copy").textContent = "Press Ctrl+C"; }
  setTimeout(() => { $("copy").textContent = "Copy key"; }, 2000);
});
</script>
</body>
</html>
